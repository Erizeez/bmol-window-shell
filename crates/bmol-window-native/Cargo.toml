[package]
name = "bmol-window-native"
description = "Native macOS window hooks, SkyLight blur, and EDR configuration for BMOL window shell."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
raw-window-handle = "0.6.2"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
core-graphics = "0.23.2"
objc2 = { version = "0.6", default-features = false }
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "NSApplication",
    "NSBitmapImageRep",
    "NSColor",
    "NSGraphics",
    "NSGraphicsContext",
    "NSImage",
    "NSImageRep",
    "NSResponder",
    "NSView",
    "NSWindow",
    "NSWorkspace",
    "objc2-core-graphics",
    "objc2-quartz-core",
] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = [
    "CFCGTypes",
    "CFString",
    "CFURL",
] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = [
    "CGColorSpace",
    "CGContext",
    "CGImage",
    "CGPDFContext",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "NSData",
    "NSDictionary",
    "NSNotification",
    "NSOperation",
    "NSString",
    "NSURL",
    "block2",
] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = [
    "CALayer",
    "CAMetalLayer",
    "objc2-core-graphics",
] }

[lints.rust]
unsafe_code = "allow"
missing_debug_implementations = "warn"
missing_docs = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
