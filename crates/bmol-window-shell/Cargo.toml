[package]
name = "bmol-window-shell"
description = "Modern seamless frameless window shell, macOS blur & EDR integration for GUI applications"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = ["iced"]
iced = ["dep:iced", "dep:spring-rs", "dep:bmol-window-glass"]
# Out-of-scope convenience helpers, opt-in per app:
assets = []
wallpaper = []
edr = []
theme = []

[dependencies]
bmol-window-native = { path = "../bmol-window-native", version = "0.1.0" }
bmol-window-platform = { path = "../bmol-window-platform", version = "0.1.0" }
bmol-window-glass = { path = "../bmol-window-glass", version = "0.1.0", optional = true }
raw-window-handle = "0.6.2"
iced = { version = "0.14.0", default-features = false, features = ["wgpu", "advanced", "canvas", "svg", "image-without-codecs", "smol"], optional = true }
spring-rs = { git = "https://github.com/Erizeez/spring-rs.git", tag = "v0.1.0", optional = true }

[dev-dependencies]
bytemuck = { version = "1.24.0", features = ["derive"] }
iced = { version = "0.14.0", default-features = false, features = ["wgpu", "advanced", "canvas", "svg", "image-without-codecs", "smol"] }
iced_wgpu = { version = "0.14.0", features = ["svg", "image"] }
flate2 = "1.0"
image = { version = "0.25.10", default-features = false, features = ["png", "webp"] }
liquid-glass = { package = "bmol-iced", path = "../../../bmol-iced/crates/bmol-iced", version = "0.1.0" }
liquid-rs = { path = "../../../liquid-rs/crates/liquid-rs", version = "0.1.0" }
liquid-glass-render = { path = "../../../liquid-rs/crates/liquid-glass-render", version = "0.1.0" }
liquid-glass-scene = { path = "../../../liquid-rs/crates/liquid-glass-scene", version = "0.1.0" }
liquid-glass-ui = { path = "../../../bmol-iced/crates/liquid-glass-ui", version = "0.1.0" }
bmol-designs = { path = "../../../bmol-designs", version = "0.1.0" }
pollster = "1.0.1"
macos-typography = { git = "https://github.com/Erizeez/macos-fonts.git", tag = "v0.1.4" }
spring-rs = { git = "https://github.com/Erizeez/spring-rs.git", tag = "v0.1.0" }
wgpu = { version = "27.0.1", features = ["noop"] }
window-vibrancy = "0.8.0"
winit = "0.30.12"
raw-window-handle = "0.6.2"

[lints]
workspace = true

[[example]]
name = "window_demo"
path = "examples/window_demo.rs"

[[example]]
name = "window_controls_demo"
path = "examples/window_controls_demo.rs"

[[example]]
name = "minimal_shell"
path = "examples/minimal_shell.rs"

