[workspace]
resolver = "2"
members = [
    "crates/bmol-window-shell",
    "crates/bmol-window-native",
    "crates/bmol-window-platform",
    "crates/bmol-window-glass",
]

[workspace.package]
version = "0.1.3"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"
authors = ["Erizeez <zhangyongcheng@sjtu.edu.cn>"]
repository = "https://github.com/Erizeez/bmol-window-shell"
homepage = "https://github.com/Erizeez/bmol-window-shell"
readme = "README.md"
keywords = ["macos", "window", "skylight", "blur", "edr", "frameless"]
categories = ["gui", "os::macos-apis"]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
missing_docs = "allow"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 2
